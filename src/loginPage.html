<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prijava</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="login-page">
<div class="login-page__container">
    <h1 class="login-page__title">Prijava</h1>
    <form class="login-page__form">
        <div class="login-page__form-group">
            <label for="login-username" class="login-page__form-label">Korisničko ime ili Email</label>
            <input type="text" id="login-username" name="login-username" class="login-page__form-input">
        </div>
        <div class="login-page__form-group">
            <label for="login-password" class="login-page__form-label">Lozinka</label>
            <input type="password" id="login-password" name="login-password" class="login-page__form-input">
        </div>
        <button type="submit" class="login-page__form-button">Prijavi se</button>
    </form>
    <p class="login-page__register-link">
        Nemaš nalog?
        <a href="registerPage.html" class="login-page__register-link--anchor">Registruj se</a>
    </p>
</div>

<script src="js/login.js"></script>
</body>
</html>
