<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registracija</title>
    <link rel="stylesheet" href="css/main.css">

</head>
<body class="register-page">
<div class="register-page__container">
    <h1 class="register-page__title">Registracija</h1>
    <form class="register-page__form">
        <div class="register-page__form-group">
            <label for="username" class="register-page__form-label">Korisničko ime</label>
            <input type="text" id="username" name="username" class="register-page__form-input">
        </div>
        <div class="register-page__form-group">
            <label for="email" class="register-page__form-label">Email</label>
            <input type="email" id="email" name="email" class="register-page__form-input">
        </div>
        <div class="register-page__form-group">
            <label for="password" class="register-page__form-label">Lozinka</label>
            <input type="password" id="password" name="password" class="register-page__form-input">
        </div>
        <div class="register-page__form-group">
            <label for="confirm-password" class="register-page__form-label">Potvrdi lozinku</label>
            <input type="password" id="confirm-password" name="confirm-password" class="register-page__form-input">
        </div>
        <button type="submit" class="register-page__form-button">Registruj se</button>
    </form>
    <p class="register-page__login-link">
        Već imaš nalog?
        <a href="loginPage.html" class="register-page__login-link--anchor">Prijavi se</a>
    </p>
</div>
<script src="js/register.js"></script>
</body>
</html>
