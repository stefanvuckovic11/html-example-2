<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Example App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.7/handlebars.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/script-index.js"></script>
    <script src="js/accordion.js"></script>
    <script src="js/productLoader.js"></script>
</head>
<body>
<div id="loader" class="loader">
    <div class="loader__spinner"></div>
</div>
<div id="app"></div>

<script id="mainLayoutTemplate" type="text/x-handlebars-template">
    {{> main}}
  </script>

<script id="indexTemplate" type="text/x-handlebars-template">
    <div class="index">
        <div class="index__left">
            {{> indexLeft/accordion}}
            {{> indexLeft/brandPromo}}
            {{> indexLeft/brandSearch}}
            {{> indexLeft/newsletter}}
            {{> indexLeft/productCard}}
            {{> indexLeft/productCard}}
            {{> indexLeft/brandPromo}}
        </div>
        <div class="index__right">
            {{> indexRight/slider}}
            {{> indexRight/previewPartial section="hot-offer" iconClass="fa fa-fire" headerText="VRUĆA PONUDA" footerButtonText="POGLEDAJTE SVE PROIZVODE IZ VRUĆE PONUDE"}}
            {{> indexRight/previewPartial section="action" iconClass="fa fa-tag" headerText="AKCIJA - POPUSTI" footerButtonText="POGLEDAJTE SVE PROIZVODE IZ AKCIJE"}}
            {{> indexRight/previewPartial section="recommended" iconClass="fa fa-star" headerText="PREPORUČUJEMO" footerButtonText="POGLEDAJTE SVE PROIZVODE IZ PREPORUČENIH"}}
            {{> indexRight/previewPartial section="new" iconClass="fa fa-heart" headerText="NOVO U PONUDI" footerButtonText="POGLEDAJTE SVE PROIZVODE IZ NOVIH"}}
            {{> indexRight/previewPartial section="sale" iconClass="fa fa-percent" headerText="RASPRODAJA" footerButtonText="POGLEDAJTE SVE PROIZVODE IZ RASPRODAJE"}}
            {{> indexRight/brandSearchRight}}
            {{> indexRight/newsletterRight}}
        </div>
    </div>
</script>

<script>
    var partials = [
        { name: "indexLeft/accordion", url: "views/partials/indexLeft/accordion.handlebars" },
        { name: "indexLeft/brandPromo", url: "views/partials/indexLeft/brandPromo.handlebars" },
        { name: "indexLeft/brandSearch", url: "views/partials/indexLeft/brandSearch.handlebars" },
        { name: "indexLeft/newsletter", url: "views/partials/indexLeft/newsletter.handlebars" },
        { name: "indexLeft/productCard", url: "views/partials/indexLeft/productCard.handlebars" },
        { name: "indexRight/slider", url: "views/partials/indexRight/slider.handlebars" },
        { name: "indexRight/previewPartial", url: "views/partials/indexRight/previewPartial.handlebars" },
        { name: "indexRight/brandSearchRight", url: "views/partials/indexRight/brandSearchRight.handlebars" },
        { name: "indexRight/newsletterRight", url: "views/partials/indexRight/newsletterRight.handlebars" },
        { name: "main", url: "views/layouts/main.handlebars" }
    ];
    var partialsLoaded = [];
    partials.forEach(function(partial) {
        partialsLoaded.push($.get(partial.url, function(template) {
            Handlebars.registerPartial(partial.name, template);
        }));
    });
    $.when.apply($, partialsLoaded).done(function() {
        var indexSource = document.getElementById("indexTemplate").innerHTML;
        var indexTemplate = Handlebars.compile(indexSource);
        var indexHTML = indexTemplate({});
        var mainSource = document.getElementById("mainLayoutTemplate").innerHTML;
        var mainTemplate = Handlebars.compile(mainSource);
        var finalHTML = mainTemplate({ title: "Example App", body: indexHTML });
        document.getElementById("app").innerHTML = finalHTML;
        window.initIndexScripts();
        window.initAccordion();
        window.initProductLoader();
    });
</script>
</body>
</html>
