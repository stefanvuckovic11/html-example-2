<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Example App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/main.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.7/handlebars.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

<div id="loader" class="loader">
    <div class="loader__spinner"></div>
</div>
<div id="app"></div>

<script id="mainLayoutTemplate" type="text/x-handlebars-template">
    {{> main}}
</script>

<script id="indexTemplate" type="text/x-handlebars-template">
    <div class="index">
        <div class="index__left">
            {{> indexLeft/accordion}}
            {{> indexLeft/brandPromo}}
            {{> indexLeft/brandSearch}}
            {{> indexLeft/newsletter}}
            {{> indexLeft/brandPromo}}
        </div>
        <div class="index__right">
            {{> indexRight/slider}}
            {{> indexRight/previewPartial section="hotOffer" iconClass="fa fa-fire" headerText="VRUĆA PONUDA" footerButtonText="POGLEDAJTE SVE PROIZVODE IZ VRUĆE PONUDE"}}
            {{> indexRight/previewPartial section="action" iconClass="fa fa-tag" headerText="AKCIJA - POPUSTI" footerButtonText="POGLEDAJTE SVE PROIZVODE IZ AKCIJE"}}
            {{> indexRight/previewPartial section="recommended" iconClass="fa fa-star" headerText="PREPORUČUJEMO" footerButtonText="POGLEDAJTE SVE PROIZVODE IZ PREPORUČENIH"}}
            {{> indexRight/previewPartial section="new" iconClass="fa fa-heart" headerText="NOVO U PONUDI" footerButtonText="POGLEDAJTE SVE PROIZVODE IZ NOVIH"}}
            {{> indexRight/previewPartial section="sale" iconClass="fa fa-percent" headerText="RASPRODAJA" footerButtonText="POGLEDAJTE SVE PROIZVODE IZ RASPRODAJE"}}
            {{> indexRight/brandSearchRight}}
            {{> indexRight/newsletterRight}}
        </div>
    </div>
</script>

<script id="product-template" type="text/x-handlebars-template">
    <div class="index__right__{{category}}__product">
        {{#if discount}}
            <span class="index__right__{{category}}__product__discount">{{discount}}</span>
        {{/if}}
        <a href="openProduct.html?productId={{id}}">
        <img src="{{mainImage}}" alt="{{title}}" class="index__right__{{category}}__product__img" />
        <h3 class="index__right__{{category}}__product__title">{{title}}</h3>
        </a>
        {{#if timer}}
            <p class="index__right__{{category}}__product__timer">{{timer}}</p>
        {{/if}}
        <p class="index__right__{{category}}__product__price">
            <span class="index__right__{{category}}__product__old-price">{{price.old}}</span>
            <span class="index__right__{{category}}__product__new-price">{{price.new}}</span>
        </p>
    </div>
</script>

<script src="js/script-index.js"></script>
<script src="js/accordion.js"></script>
<script src="js/productLoader.js"></script>

</body>
</html>
