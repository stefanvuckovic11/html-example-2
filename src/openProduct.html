<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Details</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.7/handlebars.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
<div id="loader" class="loader">
    <div class="loader__spinner"></div>
</div>
<div id="app"></div>

<script id="mainLayoutTemplate" type="text/x-handlebars-template">
    {{> main}}
  </script>

<script id="openProductTemplate" type="text/x-handlebars-template">
    {{> openProduct}}
  </script>

<script>
    const content = document.getElementById("app");

    axios.get("views/openProduct.handlebars")
        .then(res => {
            Handlebars.registerPartial("openProduct", res.data);
            return axios.get("views/partials/openProductLeft/productBreadcrumb.handlebars");
        })
        .then(res => {
            Handlebars.registerPartial("openProductLeft/productBreadcrumb", res.data);
            return axios.get("views/partials/openProductLeft/productGallery.handlebars");
        })
        .then(res => {
            Handlebars.registerPartial("openProductLeft/productGallery", res.data);
            return axios.get("views/partials/openProductLeft/productInfo.handlebars");
        })
        .then(res => {
            Handlebars.registerPartial("openProductLeft/productInfo", res.data);
            return axios.get("views/partials/openProductLeft/productAdditional.handlebars");
        })
        .then(res => {
            Handlebars.registerPartial("openProductLeft/productAdditional", res.data);
            return axios.get("views/partials/openProductLeft/productSimilar.handlebars");
        })
        .then(res => {
            Handlebars.registerPartial("openProductLeft/productSimilar", res.data);
            return axios.get("views/partials/openProductRight/sidebarVideo1.handlebars");
        })
        .then(res => {
            Handlebars.registerPartial("openProductRight/sidebarVideo1", res.data);
            return axios.get("views/partials/openProductRight/sidebarVideo2.handlebars");
        })
        .then(res => {
            Handlebars.registerPartial("openProductRight/sidebarVideo2", res.data);
            return axios.get("views/partials/openProductRight/sidebarNews.handlebars");
        })
        .then(res => {
            Handlebars.registerPartial("openProductRight/sidebarNews", res.data);
            return axios.get("views/partials/general/productCard.handlebars");
        })
        .then(res => {
            Handlebars.registerPartial("general/productCard", res.data);
            return axios.get("views/layouts/main.handlebars");
        })
        .then(res => {
            Handlebars.registerPartial("main", res.data);
            return Promise.resolve();
        })
        .then(() => {
            const params = new URLSearchParams(window.location.search);
            const productId = params.get("productId");

            axios.get("http://localhost:3000/products/" + productId)
                .then(response => {
                    const productData = response.data;
                    axios.get("http://localhost:3000/products?type=" + productData.type)
                        .then(similarResponse => {
                            const allSimilar = similarResponse.data;
                            const similar = allSimilar.filter(p => p.id !== productData.id).slice(0,4);
                            productData.similarProducts = similar;
                            productData.similarConfig = {
                                trapezoidColor: "#ccc",
                                iconClass: "fa-thumbs-up",
                                headerText: "Slični proizvodi",
                                footerButtonText: "Pogledaj sve",
                                buttonBorderColor: "#ccc"
                            };

                            const productSource = document.getElementById("openProductTemplate").innerHTML;
                            const productTemplate = Handlebars.compile(productSource);
                            const productHTML = productTemplate({ product: productData });

                            const mainSource = document.getElementById("mainLayoutTemplate").innerHTML;
                            const mainTemplate = Handlebars.compile(mainSource);
                            const finalHTML = mainTemplate({ title: "Product Details", body: productHTML });

                            content.innerHTML = finalHTML;

                            const loader = document.getElementById("loader");
                            if (loader) loader.style.display = "none";

                            if (window.initOpenProductInteractions) {
                                window.initOpenProductInteractions();
                            }
                        })
                        .catch(error => {
                            console.error("Error fetching similar products", error);
                            const loader = document.getElementById("loader");
                            if (loader) loader.style.display = "none";
                        });
                })
                .catch(error => {
                    console.error("Error fetching product", error);
                    const loader = document.getElementById("loader");
                    if (loader) loader.style.display = "none";
                });
        })
        .catch(err => {
            console.error("Error loading partials:", err);
        });
</script>

<script src="js/script-openproduct.js"></script>
</body>
</html>
